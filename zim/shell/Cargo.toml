# ZIM desktop shell — the Tauri 2 application (M21).
#
# A thin shell: windowing, tray, OS integration, and engine
# lifecycle (attach / spawn-detached). All management UI stays in
# the engine-served frontend package (AD-6/AD-21); this crate must
# never grow feature logic.
#
# Deliberately its OWN cargo workspace, separate from the engine's:
# the engine tree stays free of GUI-adjacent dependencies (webkit,
# gtk) so engine CI never needs them, and the shell's lockfile
# churn never touches the engine's.

[workspace]

[package]
name = "zim_shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["ZaminMC"]
description = "ZIM desktop shell (Tauri 2): windowing, tray, and engine lifecycle for the Zamin Instances Manager."
repository = "https://github.com/ZaminInstancesManager/ZIM"
homepage = "https://github.com/ZaminInstancesManager/ZIM"
documentation = "https://github.com/ZaminInstancesManager/ZIM/tree/main/zim/shell"

[[bin]]
name = "zim_shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
thiserror = "2"

# 2026-10-16: every zip crate release from 2.0.0 through 9.0.2 was
# wholesale-yanked on crates.io (only 9.0.3/9.0.4 remain installable).
# The published tauri-plugin-updater 2.14.0 still requires zip ^4 on
# Windows targets, so a fresh resolve (the lockfile predates the
# updater dependency) fails outright. Tauri's fix — zip v9, PR
# tauri-apps/plugins-workspace#3698, commit ba98bfad — is committed
# upstream but not yet released to crates.io; pin the patch to it
# until the next updater release, then delete this block and take
# the crates.io version.
[patch.crates-io]
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "ba98bfad" }
