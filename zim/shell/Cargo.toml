# ZIM desktop shell — the Tauri 2 application (M21).
#
# A thin shell: windowing, tray, OS integration, and engine
# lifecycle (attach / spawn-detached). All management UI stays in
# the engine-served frontend package (AD-6/AD-21); this crate must
# never grow feature logic.
#
# Deliberately its OWN cargo workspace, separate from the engine's:
# the engine tree stays free of GUI-adjacent dependencies (webkit,
# gtk) so engine CI never needs them, and the shell's lockfile
# churn never touches the engine's.

[workspace]

[package]
name = "zim_shell"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["ZaminMC"]
description = "ZIM desktop shell (Tauri 2): windowing, tray, and engine lifecycle for the Zamin Instances Manager."
repository = "https://github.com/ZaminInstancesManager/ZIM"
homepage = "https://github.com/ZaminInstancesManager/ZIM"
documentation = "https://github.com/ZaminInstancesManager/ZIM/tree/main/zim/shell"

[[bin]]
name = "zim_shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
thiserror = "2"
