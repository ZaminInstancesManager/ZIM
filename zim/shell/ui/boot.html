<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZIM</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body data-phase="boot">
  <main class="center">
    <div class="mark" aria-hidden="true">
      <span class="mark-caret"></span>
      <span class="mark-dot"></span>
    </div>
    <h1>ZIM</h1>
    <p id="status" class="status">Starting the ZIM engine…</p>
    <p class="hint">The engine is an independent process — closing this window never stops your servers.</p>
  </main>
  <script src="boot.js" defer></script>
</body>
</html>
