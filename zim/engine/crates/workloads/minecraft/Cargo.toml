[package]
name = "zim_engine_workloads_minecraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "zim_engine_workloads_minecraft"
path = "src/lib.rs"

[dependencies]
# The workload-kind discriminator this integration registers.
zim_engine_domain = { workspace = true }
# The integration SDK (trait + manifest + the declaration macro,
# re-exported).
zim_engine_workloads_sdk = { workspace = true }
# The egg model (GameServerSpec snapshots the imported egg's
# behavioral bits: stop config, parser rules, install script).
zim_engine_eggs = { workspace = true }
# The runtime abstraction the workload handle bridges (Runtime,
# InstanceConfig, ExecCommand, ResourceUsage, ConsoleAttachment).
zim_engine_application = { workspace = true }
# The Wings-parity file API (the FilesystemCapable implementation's
# engine).
zim_engine_files = { workspace = true }
# Spec (de)serialization.
serde = { workspace = true }
serde_json = { workspace = true }
# Startup-done detection (the egg's `config.startup.done` regex) and
# the legacy `file` parser's find/replace rules.
regex = { workspace = true }
# Migration checkpoint markers.
chrono = { workspace = true }
# The handle's sync→async bridge (a runtime Handle carried per
# workload; capability calls block on it from worker threads).
tokio = { workspace = true, features = [
    "rt",
    "time",
    "sync",
    "macros",
    # io-util: AsyncWriteExt on the console pump's stdin path.
    "io-util",
] }
# The error surfaces.
thiserror = { workspace = true }

[dev-dependencies]
# The Docker runtime factory + adapter the parity tests drive.
zim_engine_runtime_docker = { workspace = true }
# The backup engine (the M17 acceptance: a backup can be created
# and restored over the workload's data).
zim_engine_backups = { workspace = true }
# The docker client + stream draining for the in-test fakemc image
# build.
bollard = { workspace = true }
futures-util = { workspace = true }
# The in-memory build context for the fakemc image.
tar = { workspace = true }
# Byte buffers for the image-build request body.
bytes = "1"
# Unique container names and temp data dirs per test run.
uuid = { workspace = true }
# The parity tests run on a multi-thread runtime (the spawn_blocking
# ↔ Handle::block_on bridge requires workers to drive IO/timers
# while a blocking thread awaits a capability call).
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
