[package]
name = "zim_engine_backups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "zim_engine_backups"
path = "src/lib.rs"

[dependencies]
zim_engine_application = { workspace = true }
zim_engine_domain = { workspace = true }
zim_engine_jobs = { workspace = true }
# Object-safe async trait methods (the JobHandler contract).
async-trait = { workspace = true }
# Timestamps on sealed backup rows.
chrono = { workspace = true }
# The executor's spawn_blocking bridge + the archive engine runs on
# the blocking pool.
tokio = { workspace = true }
# Backup archive identity (uuid file names) and sha256 recording.
uuid = { workspace = true }
sha2 = { workspace = true }
# tar + gzip (pure-Rust backend) archive assembly and extraction.
tar = { workspace = true }
flate2 = { workspace = true }
# The archive + service error surfaces.
thiserror = { workspace = true }
# The restore job's payload (target backup id).
serde_json = { workspace = true }

[dev-dependencies]
# In-memory store for the service/handler tests.
zim_engine_persistence_sqlite = { workspace = true }
