[package]
name = "zim_engine_main"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "zim_engine_main"
path = "src/lib.rs"

[[bin]]
name = "zim_engine"
path = "src/main.rs"

[dependencies]
zim_engine_application = { workspace = true }
zim_engine_api = { workspace = true }
# M28: the SFTP transport listener (started after the HTTPS server).
zim_engine_sftp = { workspace = true }
zim_engine_persistence_sqlite = { workspace = true }
zim_engine_runtime_docker = { workspace = true }
zim_engine_streaming = { workspace = true }
zim_engine_scheduler = { workspace = true }
zim_engine_jobs = { workspace = true }
# M8: the backup service + its job handler, composed here.
zim_engine_backups = { workspace = true }
zim_engine_transfers = { workspace = true }
# M8.3: the install service (the §10.3 install mutation + the
# constrained-container install job handler).
zim_engine_installs = { workspace = true }
zim_engine_auth = { workspace = true }
zim_engine_authz = { workspace = true }
zim_engine_audit = { workspace = true }
zim_engine_metrics = { workspace = true }
zim_engine_platform = { workspace = true }
zim_engine_frontend_loader = { workspace = true }
# M24: the addon system — ExtensionsService + ThemeService
# construction and boot (bundled-default seeding, §4.10 isolation).
zim_engine_extensions = { workspace = true }
zim_engine_domain = { workspace = true }
# M10: the Pterodactyl Panel migration importer (the offline
# `migrate` subcommand; the engine never links it into the serving
# path — it runs and exits before the async runtime boots).
zim_engine_migrate_pterodactyl = { workspace = true }
# Async runtime + signal handling for the engine process.
tokio = { workspace = true }
# OS entropy for the generated bootstrap password.
rand_core = { workspace = true }
# M11: parsing the engine version for the frontend gate.
semver = { workspace = true }
# M11: recovery-notice audit metadata.
serde_json = { workspace = true }
# M21: the shell-discovery file's descriptor derives.
serde = { workspace = true }
# M24: timestamps for the addon boot-notice audit records.
chrono = { workspace = true }
# ── M16: the first-party workload integrations (optional) ─────────
# The engine does not consume the integrations until their
# implementation milestones (M17+) register them in the kind
# registry; `workloads-all` builds them alongside the engine so the
# feature-gated inclusion path (RUST_ENGINE.md §12.4, AD-15) is
# exercised from day one.
zim_engine_workloads_minecraft = { workspace = true, optional = true }
zim_engine_workloads_database = { workspace = true, optional = true }
zim_engine_workloads_website = { workspace = true, optional = true }
zim_engine_workloads_dev_process = { workspace = true, optional = true }
zim_engine_workloads_generic_container = { workspace = true, optional = true }
# The trait whose methods the linkage module calls.
zim_engine_workloads_sdk = { workspace = true, optional = true }

[features]
# Builds all five first-party workload integrations with the engine
# (roadmap §M16 deliverable).
workloads-all = [
    "dep:zim_engine_workloads_sdk",
    "dep:zim_engine_workloads_minecraft",
    "dep:zim_engine_workloads_database",
    "dep:zim_engine_workloads_website",
    "dep:zim_engine_workloads_dev_process",
    "dep:zim_engine_workloads_generic_container",
]

[dev-dependencies]
# TLS-enabled client for the end-to-end engine smoke test.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
# JSON bodies in the smoke test.
serde_json = { workspace = true }
