[package]
name = "zim_engine_api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "zim_engine_api"
path = "src/lib.rs"

[dependencies]
zim_engine_domain = { workspace = true }
zim_engine_application = { workspace = true }
zim_engine_auth = { workspace = true }
zim_engine_authz = { workspace = true }
# M28: the chrooted per-instance filesystem the file-API family
# operates on (the same crate the backup pipeline archives through).
zim_engine_files = { workspace = true }
# The M7 streaming hub (supervision publishes; the stream endpoint
# subscribes).
zim_engine_streaming = { workspace = true }
# M8: the durable-job executor (job creation/cancellation handlers)
# and the backup service (the §10.5 backup mutation family).
zim_engine_jobs = { workspace = true }
zim_engine_backups = { workspace = true }
# M8.2: the transfer service (the §10.9 transfer mutation family).
zim_engine_transfers = { workspace = true }
# M8.3: the install service (the §10.3 install mutation).
zim_engine_installs = { workspace = true }
# M9: the egg importer (the §10.11 import endpoint) and the cron
# scheduler (the §10.6 run-now endpoint + AppState wiring).
zim_engine_eggs = { workspace = true }
zim_engine_scheduler = { workspace = true }
# M30: the telemetry service — the §10.3a metrics history endpoint
# (the durable series' query path).
zim_engine_telemetry = { workspace = true }
# M11: the frontend loader — the §10.14 package endpoints and the
# `/zim/` page-serving surface over the active package.
zim_engine_frontend_loader = { workspace = true }
# M24: the addon system — the §10.12 extension family, the addon
# `/zim/` fallback routing, and the packaged-theme family.
zim_engine_extensions = { workspace = true }
# Async runtime (listener, middleware, spawn_blocking bridge).
tokio = { workspace = true }
# HTTP framework: router, extractors, `from_fn` middleware, and
# (M7) the `/api/v1/stream` WebSocket upgrade.
axum = { workspace = true, features = ["ws"] }
axum-core = { workspace = true }
# `ServiceExt::oneshot` for handler-level tests.
tower = { workspace = true }
# Connection serving under the manual TLS accept loop.
hyper-util = { workspace = true }
# Loopback TLS (self-signed certificate, HTTPS-only transport).
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
# Body buffering (error-body request-id injection, idempotency capture).
http-body-util = { workspace = true }
# Opaque audit-cursor encoding.
base64 = { workspace = true }
# Graceful connection draining.
tokio-util = { workspace = true }
# JSON (de)serialization of request/response bodies.
serde = { workspace = true }
serde_json = { workspace = true }
# Timestamps (rate-limit windows, idempotency TTL, ETag validators).
chrono = { workspace = true }
# Request-id generation and strongly-typed path ids.
uuid = { workspace = true }
# Error type for ApiError.
thiserror = { workspace = true }
# ETag/idempotency fingerprint digests.
sha2 = { workspace = true }
# M27: the per-boot engine-control token's entropy source.
rand_core = { workspace = true }
# M7: splitting the WebSocket socket (SinkExt/StreamExt) in the
# stream handler.
futures-util = { workspace = true }

[dev-dependencies]
# M11: engine-version fixtures for the frontend loader in test engines.
semver = { workspace = true }
# M11: assembling frontend-package upload archives in the
# frontend/pages integration tests.
zip = { workspace = true }
# In-memory persistence adapter for integration tests.
zim_engine_persistence_sqlite = { workspace = true }
# The transfer service (M8.2) + install service (M8.3) assembled
# by the test engines.
zim_engine_transfers = { workspace = true }
zim_engine_installs = { workspace = true }
# The streaming hub's types for the WebSocket tests.
zim_engine_streaming = { workspace = true }
# The scripted mock runtime for the lifecycle endpoint tests
# (no Docker dependency in the workspace's main CI job).
zim_engine_application = { workspace = true, features = ["test-util"] }
# TLS-enabled HTTP client for the socket-level integration tests
# (danger_accept_invalid_certs against the generated loopback cert).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
# M7: the WebSocket client for the `/api/v1/stream` integration
# tests (plain-HTTP upgrade against a test router; no TLS needed
# because the handshake-level auth tests assert statuses the
# middleware produces before the socket exists). The `handshake`
# feature unlocks the raw `client::client` handshake over an
# already-established TLS stream — `stream_tls_ws.rs` drives the
# production accept loop with tokio-rustls directly (no TLS feature
# of tungstenite needed: the connection is ours before the
# handshake is).
tokio-tungstenite = { version = ">=0.26, <0.28", features = ["handshake"] }
futures-util = { workspace = true }
