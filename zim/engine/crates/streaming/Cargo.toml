[package]
name = "zim_engine_streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "zim_engine_streaming"
path = "src/lib.rs"

[dependencies]
zim_engine_domain = { workspace = true }
# Subscriber notification (`Notify`) for the async `recv` surface and
# the integration tests' runtime.
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
# Event timestamps (RFC 3339 in the wire envelope).
chrono = { workspace = true }
# Wire-envelope serialization (serde_json for the convenience helpers).
serde = { workspace = true }
serde_json = { workspace = true }
# Typed subscribe errors.
thiserror = { workspace = true }
