[package]
name = "zim_engine_runtime_docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "zim_engine_runtime_docker"
path = "src/lib.rs"

[dependencies]
zim_engine_application = { workspace = true }
zim_engine_domain = { workspace = true }
# Docker Engine API client (unix socket / named pipe). This is the
# crate the architecture doc names for the Docker runtime adapter
# (docs/architecture/RUST_ENGINE.md §4 "Runtime adapters").
bollard = { workspace = true }
# Stream collection for image pull progress, exec output, and the
# one-shot stats query.
futures-util = { workspace = true }
# Async trait impls for `Runtime` / `RuntimeFactory`.
async-trait = { workspace = true }
# Timestamp mapping for `ObservedState::Running { started_at }`.
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "time",
    "sync",
    # io-util: AsyncWriteExt on the console attach's stdin writer
    # (M7.1 `Runtime::send_input`).
    "io-util",
] }

[dev-dependencies]
# Supervision-module integration (the DockerRuntime is exercised
# through the supervisor's lifecycle invariants, not just directly).
zim_engine_application = { workspace = true, features = ["test-util"] }
# M7.1 console tests inspect the hub's retained console events (the
# streaming crate's EventData vocabulary) — test-only; the library's
# dependency direction stays as RUST_ENGINE.md §2 documents.
zim_engine_streaming = { workspace = true }
# M8.1 backup tests drive the durable-job executor + the real
# archive engine over the bind-mounted instance data.
zim_engine_jobs = { workspace = true }
zim_engine_backups = { workspace = true }
# In-memory store for the supervision-over-Docker tests.
zim_engine_persistence_sqlite = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
# Unique container names per test run.
uuid = { workspace = true }
# Stream draining for image pulls in test setup.
futures-util = { workspace = true }
chrono = { workspace = true }
