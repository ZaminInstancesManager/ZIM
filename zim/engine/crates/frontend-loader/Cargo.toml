[package]
name = "zim_engine_frontend_loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# Embeds the default frontend package (zim/frontend/ at the repo
# root) into the binary at build time.
build = "build.rs"

[lib]
name = "zim_engine_frontend_loader"
path = "src/lib.rs"

[dependencies]
zim_engine_application = { workspace = true }
zim_engine_domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
ed25519-dalek = { workspace = true }
zip = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Temp-dir naming in the service lifecycle tests.
uuid = { workspace = true }
