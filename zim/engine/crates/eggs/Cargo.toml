[package]
name = "zim_engine_eggs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lib]
name = "zim_engine_eggs"
path = "src/lib.rs"

[dependencies]
# The egg domain model (Egg + satellite types).
zim_engine_domain = { workspace = true }
# Image-reference parsing (startup templates carry no deps beyond
# the domain's CommandTemplate).
# (No application-layer dependency: the importer is pure
# source-string -> Egg; persistence and API wiring compose it.)
# Timestamps on the imported rows.
chrono = { workspace = true }
# Legacy egg JSON parsing (lenient, unknown-field tolerant).
serde = { workspace = true }
serde_json = { workspace = true }
# The ZIM-native zim.toml format.
toml = { workspace = true }
# The importer's error surface.
thiserror = { workspace = true }
