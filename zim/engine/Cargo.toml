[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/api",
    "crates/persistence-sqlite",
    "crates/node-runtime",
    "crates/runtime-docker",
    "crates/streaming",
    "crates/scheduler",
    "crates/jobs",
    "crates/backups",
    "crates/transfers",
    "crates/installs",
    "crates/files",
    "crates/sftp",
    "crates/eggs",
    "crates/extensions",
    "crates/auth",
    "crates/authz",
    "crates/audit",
    "crates/metrics",
    "crates/platform",
    "crates/frontend-loader",
    "crates/migrate-pterodactyl",
    "crates/workloads/sdk",
    "crates/workloads/macros",
    "crates/workloads/minecraft",
    "crates/workloads/database",
    "crates/workloads/website",
    "crates/workloads/dev_process",
    "crates/workloads/generic_container",
    "crates/main",
]
# Deferred / TBD crates — present in the architecture doc
# (docs/architecture/RUST_ENGINE.md §1, §12.4) but not built in M2:
#   crates/persistence-postgres   (multi-node authoritative storage; deferred)
#   crates/runtime-host           (opt-in non-container runtime; TBD)
#   crates/telemetry              (opt-in telemetry ingestion; TBD)
# These will be added to `members` in their corresponding implementation
# milestones. The M16 workload crates ARE members (M16, issue #11);
# the engine consumes them behind the `workloads-all` feature.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["ZaminMC"]
repository = "https://github.com/ZaminInstancesManager/ZIM"
homepage = "https://github.com/ZaminInstancesManager/ZIM"
documentation = "https://github.com/ZaminInstancesManager/ZIM/blob/main/docs/architecture/RUST_ENGINE.md"

[workspace.dependencies]
# Internal crates — path deps so each member can depend on others via
# `dep = { workspace = true }`. Each crate's Cargo.toml uses these.
zim_engine_domain = { path = "crates/domain" }
zim_engine_application = { path = "crates/application" }
zim_engine_api = { path = "crates/api" }
zim_engine_persistence_sqlite = { path = "crates/persistence-sqlite" }
zim_engine_node_runtime = { path = "crates/node-runtime" }
zim_engine_runtime_docker = { path = "crates/runtime-docker" }
zim_engine_streaming = { path = "crates/streaming" }
zim_engine_scheduler = { path = "crates/scheduler" }
zim_engine_jobs = { path = "crates/jobs" }
zim_engine_backups = { path = "crates/backups" }
zim_engine_transfers = { path = "crates/transfers" }
zim_engine_installs = { path = "crates/installs" }
zim_engine_files = { path = "crates/files" }
zim_engine_sftp = { path = "crates/sftp" }
zim_engine_eggs = { path = "crates/eggs" }
zim_engine_extensions = { path = "crates/extensions" }
zim_engine_auth = { path = "crates/auth" }
zim_engine_authz = { path = "crates/authz" }
zim_engine_audit = { path = "crates/audit" }
zim_engine_metrics = { path = "crates/metrics" }
zim_engine_platform = { path = "crates/platform" }
zim_engine_frontend_loader = { path = "crates/frontend-loader" }
zim_engine_migrate_pterodactyl = { path = "crates/migrate-pterodactyl" }
# ── M16: the workload integration SDK + first-party skeletons ────
zim_engine_workloads_sdk = { path = "crates/workloads/sdk" }
zim_engine_workloads_macros = { path = "crates/workloads/macros" }
zim_engine_workloads_minecraft = { path = "crates/workloads/minecraft" }
zim_engine_workloads_database = { path = "crates/workloads/database" }
zim_engine_workloads_website = { path = "crates/workloads/website" }
zim_engine_workloads_dev_process = { path = "crates/workloads/dev_process" }
zim_engine_workloads_generic_container = { path = "crates/workloads/generic_container" }
# ── M10: the Panel-database migration importer ─────────────────────
# The MySQL client for the importer's live Panel adapter. Only the
# `mysql` feature of zim_engine_migrate_pterodactyl compiles it
# (the default build — and CI — stay free of the MySQL dependency
# tree). `minimal-rust` selects the pure-Rust TLS/deflate stack so
# no C client library is needed on build hosts; `chrono` maps the
# Panel's DATETIME columns onto the same chrono the engine already
# uses.
mysql = { version = "28", default-features = false, features = [
    "minimal-rust",
    "chrono",
] }

# External crates shared across multiple engine members. Each member
# that needs one of these depends on it via `<name> = { workspace = true }`.
# Versions are pinned at the workspace level so updates happen in one
# place; `cargo update -p <name>` bumps the lockfile entry.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# M9: the ZIM-native egg/server-definition format (zim.toml).
toml = "0.8"
# M9: 5-field cron expression parsing + next-fire computation
# (the scheduler crate; chrono-compatible).
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "2.0"
# SQLite driver for the persistence-sqlite adapter. "bundled" compiles
# the canonical SQLite from source (libsqlite3-sys), which keeps CI
# matrix runners (Windows/macOS) free of system SQLite dev libraries
# and pins the engine to one known-good SQLite version (incl. WAL,
# RETURNING, UPSERT support).
rusqlite = { version = "0.40", features = ["bundled"] }
# Argon2id password hashing (auth crate).
argon2 = "0.5"
# OS entropy for salts and opaque tokens (session tokens, API key
# secrets). Version 0.6 to match argon2's password-hash re-export.
rand_core = { version = "0.6", features = ["getrandom"] }
# SHA-256 for token-at-rest hashing (sessions, API keys).
sha2 = "0.10"
# ── M8: durable jobs + backups (docs/architecture/IMPLEMENTATION_ROADMAP.md §M8) ──
# Archive assembly for backup/restore (tar entries, paths, modes).
tar = "0.4"
# gzip (deflate) compression for backup archives — the pure-Rust
# miniz_oxide backend; no C toolchain needed on build hosts.
flate2 = { version = "1", default-features = false, features = [
    "rust_backend",
] }
# ── M17: the Minecraft workload integration ─────────────────────
# The integration's startup-done detection and the legacy egg
# `file` parser's find/replace rules are regex-shaped
# (Wings uses Go regexp; the Rust `regex` crate is the
# well-tested equivalent per THREAT_MODEL.md §2.7's "well-tested
# archive libraries" logic).
regex = "1"
# ── M19: the Website / DevProcess / GenericContainer integrations ─
# The DevProcess integration's file-watch restart backend
# (inotify on Linux, FSEvents on macOS, ReadDirectoryChangesW on
# Windows — the cross-platform watcher the §M19 roadmap names).
notify = "8"
# ── M5: API surface (docs/architecture/IMPLEMENTATION_ROADMAP.md §M5) ──
# Async runtime for the HTTPS listener and the middleware stack. The
# sync Persistence port is bridged with spawn_blocking (see the M3
# decision note in crates/application/src/ports.rs).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
    "sync",
    "fs",
] }
# HTTP framework (router, extractors, middleware). Axum is the
# tokio/hyper/tower-stack framework implied by the engine docs' async
# model (tokio process management, spawn_blocking bridging).
axum = "0.8"
# The core extract/response types behind axum (OptionalFromRequest for
# ApiJson's optional-body form).
axum-core = "0.5"
# Service utilities (ServiceExt::oneshot for handler tests).
tower = { version = "0.5", features = ["util"] }
# HTTP/1+H2 connection serving under the manual TLS accept loop.
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# TLS: rustls with the `ring` provider (compiles with just a C
# toolchain everywhere the CI matrix runs; avoids the aws-lc-rs cmake
# dependency). The loopback server is HTTPS-only per
# docs/api/ZIM_API_SPEC.md §1.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
# Self-signed loopback certificate generation (first-run bootstrap).
rcgen = "0.13"
# PEM parsing when re-loading the persisted loopback certificate.
rustls-pemfile = "2"
# Body buffering helpers (error-body request-id injection,
# idempotency response capture).
http-body-util = "0.1"
# Opaque pagination-cursor encoding (base64url, per ZIM_API_SPEC.md §15).
base64 = "0.22"
# Graceful connection draining (TaskTracker + CancellationToken).
tokio-util = { version = "0.7", features = ["rt", "io"] }
# ── M6: runtime abstraction + Docker runtime (§M6) ──────────────────
# Object-safe async trait methods (`Box<dyn Runtime>` /
# `Arc<dyn RuntimeFactory>`): Rust's native async-fn-in-trait is not
# dyn-compatible, and the supervision module's power queue and state
# queries share the runtime through an `Arc<dyn Runtime>`.
async-trait = "0.1"
# Async object-safety helpers are all that is needed here; streams
# (Docker attach/stats/exec output) come from bollard's re-exports
# and futures-util.
futures-util = { version = "0.3", default-features = false, features = [
    "std",
] }
# The Docker client for the `runtime-docker` adapter. Features:
# `pipe` is the unix-socket / named-pipe transport (the local-daemon
# connection the engine uses); the other default features (`http`,
# plus websocket/TLS extras when defaulted) are enabled on demand by
# later milestones — the engine's local transport needs only `pipe`.
bollard = { version = "0.21", default-features = false, features = [
    "pipe",
    "http",
] }
# POSIX shell-style word splitting for the startup command template
# (the same job shlex does for Wings's startup commands).
shlex = "2"
# ── M11: frontend loader + default frontend (§M11) ──────────────────
# SemVer range parsing/checking for frontend-package `engines.zim`
# compatibility (the same parser Cargo itself uses).
semver = "1"
# Ed25519 signature verification for frontend-package manifests
# (docs/api/FRONTEND_EXTENSION_SPEC.md §3.4; pure Rust, no C toolchain).
ed25519-dalek = { version = "2", default-features = false, features = [
    "std",
    "rand_core",
] }
# ZIP archive reading for frontend-package uploads (§10.14
# `POST /frontend/upload`; deflate only — the engine neither needs
# nor enables the AES/other default feature tree).
zip = { version = "2", default-features = false, features = [
    "deflate",
] }
# ── M16: the #[workload_integration] proc macro's toolchain ──────
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
