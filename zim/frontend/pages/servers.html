<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ZIM — Servers</title>
  <link rel="stylesheet" href="/zim/assets/main.css">
  <script type="module" src="/zim/assets/servers.js"></script>
</head>
<body>
  <main class="page page-servers">
    <zim-recovery-notice></zim-recovery-notice>

    <header class="page-header">
      <a class="backlink" href="/zim/newtab" title="New tab">←</a>
      <h1>Servers</h1>
      <span id="live-indicator" class="pill pill-unknown" title="Live updates">live: —</span>
    </header>

    <section class="card" aria-label="Server list">
      <div class="toolbar">
        <button id="refresh" class="btn" type="button">Refresh</button>
      </div>
      <div id="auth-gate" hidden>
        <p class="empty">Sign in to list your servers.</p>
        <zim-login-form id="login"></zim-login-form>
      </div>
      <table class="server-table" id="server-table">
        <thead>
          <tr>
            <th scope="col" class="col-status">Status</th>
            <th scope="col" class="col-name">Name</th>
            <th scope="col" class="col-state">State</th>
            <th scope="col" class="col-updated">Updated</th>
            <th scope="col" class="col-open"><span class="sr-only">Open</span></th>
          </tr>
        </thead>
        <tbody id="server-rows">
          <tr><td colspan="5" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
