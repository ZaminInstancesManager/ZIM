name: Shell CI

on:
  push:
    branches: [main, "m*-dev"]
    paths:
      # Run when the shell, the engine's discovery surface (the
      # engine.json contract is shared), or this workflow change.
      - 'zim/shell/**'
      - 'zim/engine/crates/main/**'
      - 'zim/engine/Cargo.toml'
      - 'zim/engine/Cargo.lock'
      - '.github/workflows/shell-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zim/shell/**'
      - 'zim/engine/crates/main/**'
      - 'zim/engine/Cargo.toml'
      - 'zim/engine/Cargo.lock'
      - '.github/workflows/shell-ci.yml'

# Cancel superseded runs on the same ref.
concurrency:
  group: shell-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  shell-build:
    name: Build + Test + Clippy + Fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three desktop platforms the shell must compile on
        # (the system-webview stack differs per OS — that is the
        # point of the matrix).
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Every run step (and the fmt drift diff) operates on the
        # shell workspace; engine work lives in the job below.
        working-directory: zim/shell
        # Bash everywhere: the fmt step's if/diff logic is POSIX
        # shell, and Windows runners default to pwsh.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri 2 system prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable + clippy + rustfmt
        # cache:false — the explicit Swatinem/rust-cache step below
        # owns caching (the setup action's internal cache would run
        # `cargo metadata` at the repo root, where no Cargo.toml
        # lives).
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy rustfmt
          cache: false

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/shell
          prefix-key: shell-ci-${{ runner.os }}

      - name: cargo fmt --check
        # Same drift-reporting pattern as Engine CI: print the full
        # diff so a remote iteration can replicate the fix.
        run: |
          if ! cargo fmt --check; then
            echo "::error::formatting drift — the full diff follows (apply with 'cargo fmt')"
            cargo fmt
            git --no-pager diff -- .
            exit 1
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      # M25 diagnostic: on Windows the shell's test binary has hit
      # STATUS_ENTRYPOINT_NOT_FOUND at load (a missing DLL export).
      # Compile the test binary without running it, probe THE exact
      # executable cargo test would run, and dump its import table
      # (dumpbin via vswhere — the loader's own message is silent in
      # CI, so the import list is the evidence trail).
      - name: Probe the Windows test binary load
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --workspace --no-run 2>&1 | Tee-Object -FilePath test-build.log | Write-Host
          $exe = Select-String -Path test-build.log -Pattern 'Executable unittests src\\lib\.rs \((.+?\.exe)\)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Select-Object -Last 1
          if (-not $exe) {
            Write-Host 'no unittest executable found to probe'
            exit 0
          }
          Write-Host "== probing $exe"
          $output = cmd /c "`"$exe`" --list 2>&1"
          Write-Host $output
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $installPath = & $vswhere -latest -property installationPath
            $dumpbin = Get-ChildItem "$installPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($dumpbin) {
              Write-Host "== dumpbin /imports of $exe"
              & $dumpbin.FullName /imports $exe |
                Select-String -Pattern '^\s+\S+\.dll' |
                ForEach-Object { $_.Line.Trim() }
            } else {
              Write-Host 'dumpbin not found under the VS installation'
            }
          } else {
            Write-Host 'vswhere not found'
          }
          exit 0

      - name: cargo test
        # Unit tests only: the engine-attach integration test skips
        # itself without ZIM_SHELL_IT_ENGINE (the engine-integration
        # job below runs it for real).
        run: cargo test --workspace

  engine-integration:
    name: Engine-attach integration (real engine, real TLS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri 2 system prerequisites (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust stable
        # cache:false — the two explicit rust-cache steps below own
        # caching (per workspace).
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Cache Cargo (shell)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/shell
          prefix-key: shell-ci-Linux

      - name: Cache Cargo (engine)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/engine
          prefix-key: engine-ci

      - name: Build the engine binary
        working-directory: zim/engine
        run: cargo build --workspace

      - name: Run the shell's engine-attach integration test
        working-directory: zim/shell
        env:
          ZIM_SHELL_IT_ENGINE: ${{ github.workspace }}/zim/engine/target/debug/zim_engine
        run: cargo test --test engine_attach -- --nocapture
