name: Engine CI

on:
  push:
    branches: [main]
    paths:
      # Run when engine code, workspace manifest, lockfile, or this workflow change.
      - 'zim/engine/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zim/engine/**'
      - '.github/workflows/engine-ci.yml'

# Cancel superseded runs on the same ref.
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build + Test + Clippy + Fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zim/engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + clippy + rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/engine
          prefix-key: engine-ci

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: Upload engine binary (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zim_engine-debug-linux-x64
          path: zim/engine/target/debug/zim_engine
          if-no-files-found: warn
          retention-days: 14

  build-matrix:
    # Smoke-build the workspace on each target platform to catch
    # platform-specific issues early. The release-quality builds
    # (with --release and binary artifacts) are in engine-release.yml.
    name: Smoke build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zim/engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/engine
          prefix-key: engine-smoke-${{ matrix.os }}

      - name: cargo build --workspace
        run: cargo build --workspace
