name: Engine CI

on:
  push:
    branches: [main, "m*-dev"]
    paths:
      # Run when engine code, workspace manifest, lockfile, the
      # frontend package, or this workflow change.
      - 'zim/engine/**'
      - 'zim/frontend/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'zim/engine/**'
      - 'zim/frontend/**'
      - '.github/workflows/engine-ci.yml'

# Cancel superseded runs on the same ref.
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build + Test + Clippy + Fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zim/engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + clippy + rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/engine
          prefix-key: engine-ci

      - name: cargo fmt --check
        # On drift, print the full diff before failing so a remote
        # iteration can replicate the exact `cargo fmt` fix without
        # a local toolchain.
        run: |
          if ! cargo fmt --check; then
            echo "::error::formatting drift — the full diff follows (apply with 'cargo fmt')"
            cargo fmt
            git --no-pager diff -- .
            exit 1
          fi

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo build --features workloads-all
        # M16: the five first-party workload integrations are
        # feature-gated into the engine (AD-15's build-time inclusion
        # path); gate the feature in CI too.
        run: cargo build -p zim_engine_main --features workloads-all

      - name: Upload engine binary (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zim_engine-debug-linux-x64
          path: zim/engine/target/debug/zim_engine
          if-no-files-found: warn
          retention-days: 14

  docker-integration:
    # M6: the DockerRuntime adapter's integration suite — real
    # container lifecycle, crash detection, reconciliation, and the
    # Wings-parity container spec. The tests self-skip when no daemon
    # answers, so this job's job is to provide the daemon (GitHub's
    # ubuntu runners ship Docker).
    #
    # M17: the Minecraft integration's parity suite runs here too —
    # the fakemc console-convention container, the file capability
    # over the bind mount, exec/metrics, backup create/restore, and
    # the migration quiesce/relaunch family (all self-skipping the
    # same way without a daemon).
    #
    # M18: the Database integration's parity suite joins — the
    # real official images (postgres:16-alpine, mariadb:11,
    # mysql:8.4, redis:7-alpine; the runtime pulls them on first
    # use): install/start/query/snapshot/restore, the recovery
    # readiness window, the second-node migration, the lock-held
    # FTWRL snapshot, the mysqlx multi-endpoint surface, and the
    # BGSAVE/RDB lifecycle. The database engines' first boots are
    # minutes-scale (initdb / mariadb-install-db / mysqld
    # --initialize), so this job runs longer than the rest — by
    # design, not by accident.
    #
    # M19: the Website / DevProcess / GenericContainer parity
    # suites join — the static carrier's real nginx container
    # (install/serve/deploy/rollback/retention + the HTTP/TCP
    # health checks), the busybox dev-process stand-in (the
    # notify-backed watch-restart supervision + the console
    # surface), and the busybox generic container (the
    # placement negotiation + the exec/network/health/
    # filesystem capability family). The website's nginx boot is
    # seconds-scale; the whole M19 family fits the job's own
    # budget alongside its siblings.
    name: Docker integration (runtime-docker + minecraft + database + website + dev_process + generic_container)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zim/engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker sanity (daemon version + network room)
        run: |
          docker version
          docker network ls

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/engine
          prefix-key: engine-docker-integration

      - name: cargo test -p zim_engine_runtime_docker
        run: cargo test -p zim_engine_runtime_docker --all-targets

      - name: cargo test -p zim_engine_workloads_minecraft
        # The parity suite builds its fakemc image in-test (busybox
        # base + the Minecraft console-contract script); busybox is
        # already local after the runtime suite's own pull.
        run: cargo test -p zim_engine_workloads_minecraft --all-targets

      - name: cargo test -p zim_engine_workloads_database
        # The §M18 parity suite: the real Postgres / MariaDB / MySQL /
        # Redis containers (pulled by the runtime on first use — the
        # images land in the job's Docker cache together).
        run: cargo test -p zim_engine_workloads_database --all-targets

      - name: cargo test -p zim_engine_workloads_website
        # The §M19 website parity suite: the static carrier's real
        # nginx container (pulled on first use) — install/serve,
        # the deploy family's atomic switch, rollback, retention,
        # and the HTTP/TCP health checks.
        run: cargo test -p zim_engine_workloads_website --all-targets

      - name: cargo test -p zim_engine_workloads_dev_process
        # The §M19 dev-process parity suite: the busybox stand-in
        # — the notify-backed watch-restart supervision, the
        # console surface, and the policy posture.
        run: cargo test -p zim_engine_workloads_dev_process --all-targets

      - name: cargo test -p zim_engine_workloads_generic_container
        # The §M19 generic-container parity suite: the busybox
        # carrier — the placement negotiation and the exec /
        # network / health / filesystem capability family.
        run: cargo test -p zim_engine_workloads_generic_container --all-targets

      - name: cargo test -p zim_engine_files
        # The file API's §2.6/§2.7 attack suite is pure host-filesystem
        # (no daemon); running it here too keeps the docker job the
        # one place the whole M17 surface is exercised together.
        run: cargo test -p zim_engine_files --all-targets

  build-matrix:
    # Smoke-build the workspace on each target platform to catch
    # platform-specific issues early. The release-quality builds
    # (with --release and binary artifacts) are in engine-release.yml.
    name: Smoke build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zim/engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/engine
          prefix-key: engine-smoke-${{ matrix.os }}

      - name: cargo build --workspace
        run: cargo build --workspace

  frontend:
    # M11: the default frontend package — TypeScript sources must
    # compile cleanly, and the committed compiled output under
    # assets/ (which the Rust engine embeds at build time, keeping
    # the engine build hermetic) must be up to date with the
    # sources. A stale dist would ship old UI bytes.
    name: Frontend (tsc + dist freshness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zim/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zim/frontend/package-lock.json

      - name: Install dev dependencies
        run: npm ci --no-fund --no-audit

      - name: Type-check the sources
        run: npm run check

      - name: Unit-test the frontend logic (node:test)
        # M22: the pure frontend logic (zim:// grammar, tab model +
        # session format, omnibox ranking) runs under node:test —
        # DOM-layer behavior stays covered by the engine's page
        # tests and the shell's engine-attach integration.
        run: npm test

      - name: Verify the committed compiled output is fresh
        run: |
          npm run build
          if ! git diff --exit-code -- assets/; then
            echo "::error::zim/frontend/assets/ is stale — recompile with 'npm run build' and commit the output."
            git diff --stat -- assets/
            exit 1
          fi
