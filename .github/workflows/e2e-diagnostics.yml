name: E2E Diagnostics

# M25 batch 12: the dedicated diagnosis instrument for the docker
# tier. The probe (`zim/e2e/src/probe.ts`) drives the full §1.4
# scenario API-only against the real engine binary on a Docker-
# bearing runner, printing every raw response, the engine's own
# ZIM_DBG supervision trace live, and — on any failure — the Docker
# daemon's view of the world. Where the suite reports "✖", this
# workflow answers "why".
#
# Manual (workflow_dispatch) so it never competes with the real
# suite for concurrency; dispatch it on m*-dev branches while
# iterating, or on main to sample a release runner's health.

on:
  workflow_dispatch:
    inputs:
      engine_dbg:
        description: "The engine's own supervision trace (ZIM_DBG=1)"
        type: boolean
        default: true

concurrency:
  group: e2e-diagnostics
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: Probe (ubuntu, docker tier)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zim/engine
          prefix-key: e2e-engine-ubuntu-latest

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: zim/e2e/package-lock.json

      - name: Build the engine (debug)
        working-directory: zim/engine
        run: cargo build -p zim_engine_main

      - name: Install the E2E harness
        working-directory: zim/e2e
        run: npm ci --no-fund --no-audit

      - name: Run the probe
        working-directory: zim/e2e
        env:
          ZIM_E2E_VERBOSE: '1'
          ZIM_DBG: ${{ inputs.engine_dbg && '1' || '' }}
        run: npm run probe

      # The focused leg: the one test the full suite still fails on
      # the docker tier, run alone with the TAP reporter so the
      # failure detail prints INLINE (the spec reporter defers it to
      # a run summary a cancelled run never prints) and with
      # --test-force-exit so the file's process always terminates.
      - name: Focused - console-stream (inline TAP)
        if: !cancelled()
        working-directory: zim/e2e
        env:
          ZIM_E2E_VERBOSE: '1'
        run: |
          npm run build
          node --test --test-timeout=180000 --test-force-exit --test-reporter=tap .build/tests/console-stream.test.js

      - name: Dump the Docker world (always)
        if: always()
        run: |
          echo "== docker version =="
          docker version --format '{{json .Server}}' || true
          echo "== docker ps -a (ZIM-labeled) =="
          docker ps -a --filter label=Service=ZIM || true
          echo "== networks =="
          docker network ls || true
          echo "== pterodactyl0 =="
          docker network inspect pterodactyl0 --format '{{json .IPAM}}' || true
          for c in $(docker ps -aq --filter label=Service=ZIM | head -6); do
            echo "== container $c =="
            docker inspect "$c" --format '{{json .State}} | {{json .HostConfig.Binds}} | {{json .Config.Cmd}}' || true
            docker logs --tail 30 "$c" 2>&1 || true
          done
